<div class="grid grid-stack">
  <div class="column column-full">
    <h2>Flagged Orders</h2>
    <div class=table-summary id=flagged-summary></div>
    <table class=compact-table id=flagged-table>
      <thead>
        <tr><th>ID</th><th>Status</th><th>Endpoint</th><th>Username</th><th>Requested</th><th>Progress</th></tr>
      </thead>
      <tbody id=flagged-body></tbody>
    </table>
  </div>

  <div class="column column-full">
    <h2>Cleared Orders</h2>
    <div class=table-summary id=cleared-summary></div>
    <table class=compact-table id=cleared-table>
      <thead>
        <tr><th>ID</th><th>Status</th><th>Endpoint</th><th>Username</th><th>Requested</th><th>Progress</th></tr>
      </thead>
      <tbody id=cleared-body></tbody>
    </table>
    <div class="table-pagination hidden">
      <button class=page-prev type=button>&lsaquo; Prev</button>
      <span class=page-status>1/1</span>
      <button class=page-next type=button>Next &rsaquo;</button>
    </div>
  </div>
</div>

<script>
function orderRow(order) {
  return renderOrderRow(order, { showHashrate: false, showReview: false });
}

function renderOrders(bodyId, orders) {
  const body = document.getElementById(bodyId);

  if (!orders || orders.length === 0) {
    body.innerHTML = '<tr><td colspan=6 class=table-empty>None</td></tr>';
    return;
  }

  body.innerHTML = orders.map(orderRow).join('');
}

const REVIEW_LIMIT = 500;
const CLEARED_PAGE_SIZE = 10;
let clearedPage = 0;
let clearedOrders = [];

const pagination = document.querySelector('#cleared-table + .table-pagination');
const prevButton = pagination.querySelector('.page-prev');
const nextButton = pagination.querySelector('.page-next');
const pageStatus = pagination.querySelector('.page-status');

prevButton.addEventListener('click', () => {
  clearedPage--;
  renderClearedPage();
});

nextButton.addEventListener('click', () => {
  clearedPage++;
  renderClearedPage();
});

function renderClearedPage() {
  const body = document.getElementById('cleared-body');
  const pageCount = Math.max(1, Math.ceil(clearedOrders.length / CLEARED_PAGE_SIZE));
  clearedPage = Math.max(0, Math.min(clearedPage, pageCount - 1));

  const pageStart = clearedPage * CLEARED_PAGE_SIZE;
  const rows = clearedOrders.slice(pageStart, pageStart + CLEARED_PAGE_SIZE);

  if (rows.length === 0) {
    body.innerHTML = '<tr><td colspan=6 class=table-empty>None</td></tr>';
  } else {
    body.innerHTML = rows.map(orderRow).join('');
  }

  const hasPrev = clearedPage > 0;
  const hasNext = clearedPage < pageCount - 1;
  pageStatus.textContent = clearedOrders.length === 0 ? '0/0' : `${clearedPage + 1}/${pageCount} (${clearedOrders.length})`;
  prevButton.disabled = !hasPrev;
  nextButton.disabled = !hasNext;
  pagination.classList.toggle('hidden', !hasPrev && !hasNext);
}

function fetchOrders(review, signal) {
  const params = new URLSearchParams({ review, limit: String(REVIEW_LIMIT) });
  return fetchJson(`/api/router/orders?${params}`, { signal });
}

async function countOrShown(shown, review, signal) {
  if (shown < REVIEW_LIMIT) return shown;

  try {
    return await fetchCount(`/api/router/orders/count?review=${review}`, signal);
  } catch (e) {
    if (e.name === 'AbortError') throw e;
    console.error(`count ${review} orders error:`, e);
    return shown;
  }
}

function reviewSummary(shown, total, label) {
  return total > shown
    ? `Showing latest ${shown} of ${total} ${label}`
    : `${total} ${label}`;
}

async function refresh(signal) {
  const [flagged, cleared] = await Promise.all([
    fetchOrders('flagged', signal),
    fetchOrders('cleared', signal),
  ]);

  const flaggedRows = flagged || [];
  const clearedRows = cleared || [];
  const [flaggedTotal, clearedTotal] = await Promise.all([
    countOrShown(flaggedRows.length, 'flagged', signal),
    countOrShown(clearedRows.length, 'cleared', signal),
  ]);

  renderOrders('flagged-body', flaggedRows);
  clearedOrders = clearedRows;
  renderClearedPage();
  document.getElementById('flagged-summary').textContent =
    reviewSummary(flaggedRows.length, flaggedTotal, 'flagged orders');
  document.getElementById('cleared-summary').textContent =
    reviewSummary(clearedRows.length, clearedTotal, 'cleared orders');
}

startPolling(refresh);
</script>
