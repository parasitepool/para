<div class="grid grid-stack">
  <div class="column column-full">
    <h2>Flagged Orders</h2>
    <table class=compact-table id=flagged-table>
      <thead>
        <tr><th>ID</th><th>Status</th><th>Endpoint</th><th>Username</th><th>Requested</th><th>Progress</th></tr>
      </thead>
      <tbody id=flagged-body></tbody>
    </table>
  </div>

  <div class="column column-full">
    <h2>Cleared Orders</h2>
    <table class=compact-table id=cleared-table>
      <thead>
        <tr><th>ID</th><th>Status</th><th>Endpoint</th><th>Username</th><th>Requested</th><th>Progress</th></tr>
      </thead>
      <tbody id=cleared-body></tbody>
    </table>
    <div class=table-pagination>
      <button class=page-prev type=button>&lsaquo; Prev</button>
      <span class=page-status>1/1</span>
      <button class=page-next type=button>Next &rsaquo;</button>
    </div>
  </div>
</div>

<script>
function orderRow(order) {
  const safeId = escapeHtml(order.id);
  const shortUsername = truncateMiddle(order.username);
  const target = order.requested_hash_days == null ? 'Unlimited' : formatHashDays(order.requested_hash_days);
  const href = `/order/${safeId}`;
  const a = (content) => `<a class=order-link href="${href}">${content}</a>`;
  return `<tr>
    <td>${a(safeId)}</td>
    <td class="${escapeHtml(statusClass(order.status))}">${a(escapeHtml(formatStatus(order.status)))}</td>
    <td>${a(escapeHtml(order.endpoint))}</td>
    <td>${a(escapeHtml(shortUsername))}</td>
    <td>${a(escapeHtml(target))}</td>
    <td>${a(formatOrderProgress(order))}</td>
  </tr>`;
}

function renderOrders(bodyId, orders) {
  const body = document.getElementById(bodyId);

  if (!orders || orders.length === 0) {
    body.innerHTML = '<tr><td colspan=6>None</td></tr>';
    return;
  }

  body.innerHTML = orders.map(orderRow).join('');
}

const CLEARED_PAGE_SIZE = 10;
let clearedPage = 0;
let clearedOrders = [];

const prevButton = document.querySelector('#cleared-table + .table-pagination .page-prev');
const nextButton = document.querySelector('#cleared-table + .table-pagination .page-next');
const pageStatus = document.querySelector('#cleared-table + .table-pagination .page-status');

prevButton.addEventListener('click', () => {
  clearedPage--;
  renderClearedPage();
});

nextButton.addEventListener('click', () => {
  clearedPage++;
  renderClearedPage();
});

function renderClearedPage() {
  const body = document.getElementById('cleared-body');
  const pageCount = Math.max(1, Math.ceil(clearedOrders.length / CLEARED_PAGE_SIZE));
  clearedPage = Math.max(0, Math.min(clearedPage, pageCount - 1));

  const pageStart = clearedPage * CLEARED_PAGE_SIZE;
  const rows = clearedOrders.slice(pageStart, pageStart + CLEARED_PAGE_SIZE);

  if (rows.length === 0) {
    body.innerHTML = '<tr><td colspan=6>None</td></tr>';
  } else {
    body.innerHTML = rows.map(orderRow).join('');
  }

  pageStatus.textContent = clearedOrders.length === 0 ? '0/0' : `${clearedPage + 1}/${pageCount} (${clearedOrders.length})`;
  prevButton.disabled = clearedPage === 0;
  nextButton.disabled = clearedPage >= pageCount - 1;
}

async function fetchOrders(review, signal) {
  const r = await fetch(`/api/router/orders?review=${review}`, withAuthOptions({ signal }));
  if (r.status === 401) {
    redirectToLogin();
    throw new Error(`/api/router/orders: ${r.status}`);
  }
  if (!r.ok) throw new Error(`/api/router/orders: ${r.status}`);
  return r.json();
}

async function refresh(signal) {
  const [flagged, cleared] = await Promise.all([
    fetchOrders('flagged', signal),
    fetchOrders('cleared', signal),
  ]);

  renderOrders('flagged-body', flagged);
  clearedOrders = cleared;
  renderClearedPage();
}

initAuthProbe().then(ok => {
  if (!ok) return;
  startPolling(refresh);
});
</script>
